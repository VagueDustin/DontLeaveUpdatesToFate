# release.yml — build the two Windows artifacts for a tag, hash them, and attach them to a draft.
#
# The point of automating this is not saving the ten minutes. It is the checksum file.
#
# `SHA256SUMS-<version>.txt` is the only thing standing between a user and an unverified executable:
# `fetchDigest` looks for it by name, and when it is absent the updater installs anyway and settles
# for a warning in the log. So the file being present, correctly formatted and actually matching the
# bytes that were uploaded is a security property of every future release — and until now it was a
# manual step performed by a person who had already done six other manual steps.
#
# The release is created as a DRAFT on purpose. `release.ts` refuses a draft or a prerelease outright
# (see `parseRelease`), so nothing here can reach a user until a human presses publish. That is what
# makes it safe for this workflow to run on any tag: a bad build is invisible, and the release notes
# in this repo are written by hand and should stay that way.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, hash and draft
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The tag names the version the updater will compare against; package.json names the version
      # electron-builder stamps into the filenames. If they disagree, the release ends up advertising
      # a version whose assets are called something else, and `assetFor` finds nothing to download.
      # Cheaper to fail here than to publish that.
      - name: Check the tag matches package.json
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          if ($pkg -ne $tag) {
            throw "Tag is v$tag but package.json says $pkg. Bump one of them."
          }
          "version=$pkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Building $pkg"

      # A release that cannot pass the gate every push has to pass has no business existing.
      - name: Verify
        run: npm run verify

      - name: Build the Windows artifacts
        run: npm run dist

      # Named explicitly rather than globbed. A glob would silently produce a shorter checksum file if
      # electron-builder's artifactName ever changed; naming them means that shows up as a failure
      # here instead of as a release whose portable build has no published hash.
      - name: Write SHA256SUMS
        shell: pwsh
        run: |
          $v = $env:version
          $names = @(
            "DontLeaveUpdatesToFate-$v-portable.exe",
            "DontLeaveUpdatesToFate-$v-setup.exe"
          )

          $lines = foreach ($name in $names) {
            $path = Join-Path 'dist' $name
            if (-not (Test-Path $path)) { throw "Expected artifact is missing: $path" }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLower()
            # `<64 hex><two spaces><bare filename>` — the sha256sum format `digestFor` parses. The
            # name must be the leaf: it is matched against the asset name GitHub serves, not a path.
            '{0}  {1}' -f $hash, $name
          }

          $out = Join-Path 'dist' "SHA256SUMS-$v.txt"
          # WriteAllLines with an explicit no-BOM encoding. `digestFor` trims each line and would
          # survive a BOM, but a checksum file that `sha256sum -c` cannot read is a broken checksum
          # file regardless of who else tolerates it.
          [System.IO.File]::WriteAllLines(
            (Join-Path $PWD $out),
            $lines,
            (New-Object System.Text.UTF8Encoding $false)
          )

          Get-Content $out | Write-Host

      - name: Draft the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:version
          $tag = '${{ github.ref_name }}'
          $files = @(
            "dist/DontLeaveUpdatesToFate-$v-portable.exe",
            "dist/DontLeaveUpdatesToFate-$v-setup.exe",
            "dist/SHA256SUMS-$v.txt"
          )

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            # Re-running a tag replaces the assets rather than failing. The draft's notes, which a
            # human may already have written, are left alone.
            Write-Host "Draft $tag already exists - replacing its assets."
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag --draft --title $v --generate-notes @files
          }
          if ($LASTEXITCODE -ne 0) { throw 'gh failed' }

          Write-Host "Draft ready. Write the notes, then publish it - until you do, the updater cannot see it."
