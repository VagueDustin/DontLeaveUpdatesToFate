<!--
  icon.svg — the source for icons at 48px and above.

  A geometric mark, per the charted tier's "geometric rather than illustrative" rule: a gilded
  diamond inside a rotated square, on the navy depth wash. The outer ring is broken at the four
  diagonals — the house "thread" drawn as an interrupted circle rather than a closed one. The arcs
  span 76° each with 14° gaps, which is wide enough to read as four segments at 48px.

  Below 48px this file collapses into mud, so `icon-small.svg` carries a simplified mark for 16–32px.

  Colours are the gold-navy primitives from @vaguedustin/brand. This file, `icon-small.svg` and
  `src/shared/brand-tokens.ts` are the only places in the project where a raw value appears — a
  raster icon cannot resolve a CSS variable.

  Derive the PNG/ICO set with `npm run icons` — never hand-edit the outputs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- The navy depth wash, flattened to what a square raster can carry. -->
    <radialGradient id="field" cx="30%" cy="0%" r="115%">
      <stop offset="0%" stop-color="#1E2A4A" />
      <stop offset="45%" stop-color="#0A0E27" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- The metallic gold ramp: gold-300 → gold-500 → gold-600 → gold-400. -->
    <linearGradient id="gilt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE9A8" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#B8902B" />
      <stop offset="100%" stop-color="#F2C94C" />
    </linearGradient>

    <linearGradient id="giltSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C94C" />
      <stop offset="100%" stop-color="#8C6A26" />
    </linearGradient>
  </defs>

  <!-- Field. The squircle radius reads correctly once Windows rounds the corners itself. -->
  <rect width="512" height="512" rx="104" fill="url(#field)" />

  <!-- The gilded hairline that carries the brand at every size. -->
  <rect x="7" y="7" width="498" height="498" rx="98" fill="none" stroke="#D4AF37" stroke-opacity="0.30" stroke-width="3" />

  <!-- Broken outer ring: the thread, interrupted. Four 76° arcs, gaps on the diagonals. -->
  <g fill="none" stroke="url(#giltSoft)" stroke-width="11" stroke-linecap="round" opacity="0.8">
    <path d="M361.89 120.46 A 172 172 0 0 0 150.11 120.46" />
    <path d="M391.54 361.89 A 172 172 0 0 0 391.54 150.11" />
    <path d="M150.11 391.54 A 172 172 0 0 0 361.89 391.54" />
    <path d="M120.46 150.11 A 172 172 0 0 0 120.46 361.89" />
  </g>

  <!-- Rotated square. -->
  <path d="M256 118 394 256 256 394 118 256Z" fill="none" stroke="url(#gilt)" stroke-width="14" stroke-linejoin="round" />

  <!-- Inner diamond. -->
  <path d="M256 186 326 256 256 326 186 256Z" fill="none" stroke="url(#gilt)" stroke-width="11" stroke-linejoin="round" />

  <!-- The core: solid gold, so the mark still reads as "gold on navy" when scaled down. -->
  <path d="M256 232 280 256 256 280 232 256Z" fill="url(#gilt)" />
</svg>
